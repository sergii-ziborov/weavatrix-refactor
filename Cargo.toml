[package]
name = "weavatrix-refactor"
version = "1.0.6"
edition = "2024"
rust-version = "1.89"
description = "Native MCP server for Weavatrix refactoring: proven edit plans, transactional application, and rollback"
license = "MIT"
repository = "https://github.com/sergii-ziborov/weavatrix-refactor"
homepage = "https://weavatrix.com"
keywords = ["mcp", "refactoring", "rename", "transactional", "weavatrix"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"

[[bin]]
name = "weavatrix-refactor"
path = "src/main.rs"

[dependencies]
blazingly-json = "0.1.0"
mcport = "0.5.0"
notify = "8.2.0"
weavatrix-rust = { version = "2.5.1", git = "https://github.com/sergii-ziborov/weavatrix-rust.git", rev = "6f4b130761d1e5bdfa599b72a76324e13db0b018", features = ["full", "lang-rust"] }
weavatrix-rust-refactor = { version = "0.1.6", git = "https://github.com/sergii-ziborov/weavatrix-rust-refactor.git", rev = "4b8d9e1b02d3d4219e938fe98029a6a61de4e534" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
